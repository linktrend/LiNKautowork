# Public webhook edge (separate project so the production Compose keeps its
# no-host-ports policy). Server 01 drops all public inbound traffic to
# containers, so ingress is an outbound-only Cloudflare Tunnel. cloudflared can
# reach only caddy; caddy alone joins autowork-runtime and forwards webhook
# paths to n8n.
name: linkautowork-edge

networks:
  edge:
    name: linkautowork_edge
    driver: bridge
  autowork-runtime:
    external: true
    name: linkautowork_autowork-runtime

volumes:
  caddy_data:
  caddy_config:

x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp

services:
  caddy:
    image: caddy:2.11.4-alpine
    <<: *default-security
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    environment:
      AUTOWORK_PUBLIC_HOST: ${AUTOWORK_PUBLIC_HOST:?public webhook host required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - autowork-runtime
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    <<: *default-security
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Cloudflare tunnel token required}
    depends_on:
      caddy:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
