services:
  nats:
    image: nats:2.10.26-alpine
    command: ["-js", "-sd", "/data"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4222 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    # No host port: only stack members may reach the event bus.
    volumes:
      - nats_jetstream_prod:/data
    restart: unless-stopped

  gateway:
    build:
      context: ../..
      dockerfile: deploy/common/gateway.Dockerfile
    env_file:
      - path: .env
        # The real runtime file is generated outside Git after GSM resolution.
        # Keeping it optional allows the checked-in names-only contract to render
        # during pre-VPS validation without creating a fake secret file.
        required: false
    depends_on:
      nats:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    secrets:
      - source: gcp-service-account
        target: gcp-service-account
        mode: 0400
    restart: unless-stopped
    # Attach an approved private gateway route before exposing this service.

  product-api:
    build:
      context: ../..
      dockerfile: apps/product-api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8080
      PRODUCT_API_JWT_ISSUER: ${PRODUCT_API_JWT_ISSUER}
      PRODUCT_API_JWT_AUDIENCE: ${PRODUCT_API_JWT_AUDIENCE}
      PRODUCT_API_JWKS_URL: ${PRODUCT_API_JWKS_URL}
      PRODUCT_API_POSTGREST_URL: ${PRODUCT_API_POSTGREST_URL:-}
      PRODUCT_API_SERVICE_ROLE_TOKEN: ${PRODUCT_API_SERVICE_ROLE_TOKEN:-}
      PRODUCT_API_SESSION_URL: ${PRODUCT_API_SESSION_URL:-}
      PRODUCT_API_WEBHOOK_SECRET: ${PRODUCT_API_WEBHOOK_SECRET:-}
      PRODUCT_API_CLIENT_ORIGIN: ${PUBLIC_CLIENT_ORIGIN:-}
      PRODUCT_API_OPERATOR_ORIGIN: ${OPERATOR_CONSOLE_ORIGIN:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # This is the only public application back-end candidate. Traefik routing is
    # attached externally after DNS/TLS authority is supplied.

  client-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: 8080
      PRODUCT_API_PUBLIC_ORIGIN: ${PUBLIC_PRODUCT_API_ORIGIN:-}
      PLATFORM_OIDC_ISSUER: ${PLATFORM_OIDC_ISSUER:-}
      PLATFORM_OIDC_CLIENT_ID: ${PLATFORM_OIDC_CLIENT_ID:-}
      PLATFORM_OIDC_REDIRECT_URI: ${PLATFORM_OIDC_REDIRECT_URI:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      product-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Public UI candidate; its external route is defined only by the approved
    # Traefik template and never exposes private controls.

  operator-console:
    build:
      context: ../..
      dockerfile: apps/operator-console/Dockerfile
    environment:
      PORT: 8080
      PRODUCT_API_PUBLIC_ORIGIN: ${PUBLIC_PRODUCT_API_ORIGIN:-}
      PLATFORM_OIDC_ISSUER: ${PLATFORM_OIDC_ISSUER:-}
      OPERATOR_OIDC_CLIENT_ID: ${OPERATOR_OIDC_CLIENT_ID:-}
      OPERATOR_OIDC_REDIRECT_URI: ${OPERATOR_OIDC_REDIRECT_URI:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      product-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Private-only. No Compose port or Traefik label is permitted here.

  migration-preflight:
    build:
      context: ../..
      dockerfile: deploy/common/release-jobs.Dockerfile
    profiles: ["release-jobs"]
    env_file:
      - path: .env
        required: false
    command: ["./ops/migration-preflight.sh"]

  certified-package-publisher:
    build:
      context: ../..
      dockerfile: deploy/common/release-jobs.Dockerfile
    profiles: ["release-jobs"]
    env_file:
      - path: .env
        required: false
    environment:
      N8N_BASE_URL: ${N8N_BASE_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      LINKAUTOWORK_APPROVED_TARGET: ${LINKAUTOWORK_APPROVED_TARGET:-}
      LINKAUTOWORK_RELEASE_AUTHORIZATION: ${LINKAUTOWORK_RELEASE_AUTHORIZATION:-}
    command: ["./ops/publish-certified-packages.sh"]
    depends_on:
      n8n:
        condition: service_healthy

  operations-scheduler:
    build:
      context: ../..
      dockerfile: deploy/common/release-jobs.Dockerfile
    profiles: ["operations"]
    env_file:
      - path: .env
        required: false
    environment:
      LINKAUTOWORK_GATEWAY_URL: http://gateway:8080
      LINK_SERVICE_TOKEN_OPERATIONS: ${LINK_SERVICE_TOKEN_OPERATIONS:-}
      PLATFORM_INVOCATION_TOKEN: ${PLATFORM_INVOCATION_TOKEN:-}
    command: ["./ops/run-operations-scheduler.sh"]
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    # Pinned official upstream n8n image (never :latest).
    # Source of truth for upgrades: https://github.com/n8n-io/n8n releases.
    # LiNKautowork does not use a LiNKtrend n8n fork (decision 2026-07-23).
    image: n8nio/n8n:2.30.0
    env_file:
      - path: .env
        required: false
    environment:
      - GENERIC_TIMEZONE=Asia/Taipei
      - TZ=Asia/Taipei
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      # Public API required for template import + global kill-switch revoke.
      # Bind n8n to Tailscale-only exposure (see docs/runbooks/TAILSCALE_HARDENING.md).
      - N8N_PUBLIC_API_DISABLED=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${SUPABASE_DB_HOST}
      - DB_POSTGRESDB_PORT=${SUPABASE_DB_PORT}
      - DB_POSTGRESDB_DATABASE=${SUPABASE_DB_DATABASE}
      - DB_POSTGRESDB_USER=${SUPABASE_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=lautowork_n8n
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - EXECUTIONS_MODE=regular
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # n8n is operator-private; Traefik/Tailscale templates define the only ingress.
    volumes:
      - n8n_data_prod:/home/node/.n8n
    secrets:
      - source: gcp-service-account
        target: gcp-service-account
        mode: 0400

volumes:
  n8n_data_prod:
  nats_jetstream_prod:

secrets:
  # The authorised deployer creates this Docker secret from the GSM-resolved
  # service-account material. Compose never names a host-file path.
  gcp-service-account:
    external: true
    name: ${GOOGLE_APPLICATION_CREDENTIALS_DOCKER_SECRET_NAME:-linkautowork-gcp-service-account}
