services:
  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4222 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    ports:
      - "4222:4222"
      - "8222:8222"

  gateway:
    build:
      context: ../..
      dockerfile: deploy/common/gateway.Dockerfile
    env_file:
      - .env
    depends_on:
      - nats
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-/etc/linktrend/gcp/linkbot-901208-e7677c682cff.json}:${GOOGLE_APPLICATION_CREDENTIALS:-/etc/linktrend/gcp/linkbot-901208-e7677c682cff.json}:ro
    restart: unless-stopped
    ports:
      - "8080:8080"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    env_file:
      - .env
    environment:
      - GENERIC_TIMEZONE=Asia/Taipei
      - TZ=Asia/Taipei
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_PUBLIC_API_DISABLED=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${SUPABASE_DB_HOST}
      - DB_POSTGRESDB_PORT=${SUPABASE_DB_PORT}
      - DB_POSTGRESDB_DATABASE=${SUPABASE_DB_DATABASE}
      - DB_POSTGRESDB_USER=${SUPABASE_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=lautowork_n8n_prod
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - EXECUTIONS_MODE=regular
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data_prod:/home/node/.n8n
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-/etc/linktrend/gcp/linkbot-901208-e7677c682cff.json}:${GOOGLE_APPLICATION_CREDENTIALS:-/etc/linktrend/gcp/linkbot-901208-e7677c682cff.json}:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=linktrend-network
      - traefik.http.routers.n8n.rule=Host(`${TRAEFIK_N8N_HOST:-n8n.linktrend.internal}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls=true
      - traefik.http.services.n8n.loadbalancer.server.port=5678
    networks:
      - default
      - linktrend-network

networks:
  linktrend-network:
    external: true

volumes:
  n8n_data_prod:
