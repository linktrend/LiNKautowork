services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: automation_contracts
    labels:
      com.linktrend.linkautowork.disposable-contracts: "true"
      com.linktrend.linkautowork.disposable-browser: "${LINKAUTOWORK_DISPOSABLE_BROWSER:-false}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d automation_contracts"]
      interval: 2s
      timeout: 2s
      retries: 30
  postgrest:
    image: postgrest/postgrest:v12.2.8
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres:${PGRST_URI_SEP:-/}/postgres@postgres:5432/automation_contracts
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: platform,lautowork,extensions
      PGRST_DB_ANON_ROLE: service_role
      PGRST_JWT_SECRET: ltfx.ph.24c6deb948.v1.disposable-postgrest-jwt
    labels:
      com.linktrend.linkautowork.disposable-contracts: "true"
      com.linktrend.linkautowork.disposable-browser: "${LINKAUTOWORK_DISPOSABLE_BROWSER:-false}"
    ports:
      - "127.0.0.1::3000"
  http:
    image: curlimages/curl:8.10.1
    command: ["sleep", "infinity"]
    depends_on:
      - postgrest
    labels:
      com.linktrend.linkautowork.disposable-contracts: "true"
      com.linktrend.linkautowork.disposable-browser: "${LINKAUTOWORK_DISPOSABLE_BROWSER:-false}"

networks:
  default:
    labels:
      com.linktrend.linkautowork.disposable-contracts: "true"
      com.linktrend.linkautowork.disposable-browser: "${LINKAUTOWORK_DISPOSABLE_BROWSER:-false}"
