groups:
  - name: linkautowork-mvo
    rules:
      - alert: LiNKautoworkUrgentDispatchP95High
        expr: histogram_quantile(0.95, sum(rate(linkautowork_ingress_dispatch_latency_ms_bucket[5m])) by (le)) > 30000
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Urgent dispatch p95 above 30s"
      - alert: LiNKautoworkCriticalFailureRateHigh
        expr: |
          (
            sum(rate(linkautowork_execution_outcome_total{criticality="critical",status="failure"}[15m]))
            /
            clamp_min(sum(rate(linkautowork_execution_outcome_total{criticality="critical"}[15m])), 0.0001)
          ) > 0.01
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Critical workflow failure rate above 1% (SLO breach risk)"
      - alert: LiNKautoworkKillSwitchActivated
        expr: sum(increase(linkautowork_killswitch_events_total{action="activate"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kill switch activated"

  - name: linkautowork-jetstream
    rules:
      - alert: LiNKautoworkJetStreamDisconnected
        expr: min(linkautowork_jetstream_connected) == 0
        for: 2m
        labels:
          severity: critical
          routing_key: jetstream-unavailable
        annotations:
          summary: "JetStream snapshot reports disconnected"
          runbook: docs/runbooks/SERVER01-OPERATIONS.md
      - alert: LiNKautoworkJetStreamConsumerLagCritical
        expr: max by (stream, consumer) (linkautowork_jetstream_consumer_lag) >= 1000
        for: 5m
        labels:
          severity: critical
          routing_key: jetstream-lag-critical
        annotations:
          summary: "JetStream consumer lag exceeded the critical snapshot threshold"
          runbook: docs/runbooks/SERVER01-OPERATIONS.md
      - alert: LiNKautoworkJetStreamConsumerLagWarning
        expr: max by (stream, consumer) (linkautowork_jetstream_consumer_lag) >= 100
        for: 10m
        labels:
          severity: warning
          routing_key: jetstream-lag
        annotations:
          summary: "JetStream consumer lag exceeded the warning snapshot threshold"
          runbook: docs/runbooks/SERVER01-OPERATIONS.md
      - alert: LiNKautoworkJetStreamAckPendingHigh
        expr: max by (stream, consumer) (linkautowork_jetstream_ack_pending) >= 500
        for: 5m
        labels:
          severity: critical
          routing_key: jetstream-lag-critical
        annotations:
          summary: "JetStream ack-pending exceeded the critical snapshot threshold"
          runbook: docs/runbooks/SERVER01-OPERATIONS.md
      - alert: LiNKautoworkJetStreamReplicaUnhealthy
        expr: min by (stream) (linkautowork_jetstream_replica_healthy) == 0
        for: 5m
        labels:
          severity: warning
          routing_key: jetstream-replica
        annotations:
          summary: "JetStream stream replica reported unhealthy on a redacted snapshot"
          runbook: docs/runbooks/SERVER01-OPERATIONS.md
      - alert: LiNKautoworkJetStreamConsumerStale
        expr: max by (stream, consumer) (linkautowork_jetstream_consumer_stale) == 1
        for: 5m
        labels:
          severity: warning
          routing_key: jetstream-stale
        annotations:
          summary: "JetStream consumer last activity exceeded the snapshot stale threshold"
          runbook: docs/runbooks/SERVER01-OPERATIONS.md
