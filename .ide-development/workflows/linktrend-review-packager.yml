name: Linktrend Fast Checks

# A checkpoint push is intentionally absent.  Phase PR updates are the only
# automatic fast-check wake, and the PR concurrency key cancels obsolete work.
on:
  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      mode:
        description: "reconciled only; never a general manual Fast trigger"
        required: true
        type: choice
        options: [reconciled]
      expected_repository:
        description: "Exact same-repository owner/name"
        required: true
        type: string
      expected_commit:
        description: "Exact development 40-character commit"
        required: true
        type: string
      expected_tree:
        description: "Exact development 40-character Git tree"
        required: true
        type: string
      package_version:
        description: "Installed immutable managed-core version"
        required: true
        type: string
      installed_state_digest:
        description: "Canonical installed-state SHA-256"
        required: true
        type: string
      target_baseline_sha:
        description: "Runtime-supplied exact 40-character target baseline SHA"
        required: false
        type: string
      target_baseline_ref:
        description: "Runtime-supplied authoritative remote target ref"
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.repository }}|${{ github.workflow }}|pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast:
    name: Linktrend Fast Checks
    if: >-
      github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'phase/')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
      LINKTREND_TARGET_BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
      LINKTREND_TARGET_BASELINE_REF: ${{ format('origin/{0}', github.event.pull_request.base.ref) }}
    steps:
      - name: Checkout exact Phase PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Fast profile Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input "jsonschema==4.26.0"

      - name: Reject stale or non-Phase dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_branch="$(jq -r .head.ref <<<"${pr}")"
          live="$(jq -r .head.sha <<<"${pr}")"
          case "${live_branch}" in phase/*) ;; *) echo "fast_checks_require_phase_branch: ${live_branch}"; exit 1;; esac
          test "${live}" = "${EXPECTED_HEAD}" || { echo "fast_checks_stale_pr_head: expected=${EXPECTED_HEAD} live=${live}"; exit 1; }
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${EXPECTED_HEAD}" || {
            echo "fast_checks_head_mismatch: expected=${EXPECTED_HEAD} actual=${actual}"
            exit 1
          }

      - name: Run fast profile
        run: |
          set -euo pipefail
          python3 scripts/gitops/generated_output_closure.py --finalize
          python3 scripts/gitops/run_delivery_profile.py fast --preflight

      - name: Retain fast-check evidence
        if: always()
        run: |
          {
            echo "workflow=Linktrend Fast Checks"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "pr=${PR_NUMBER}"
            echo "head=${EXPECTED_HEAD}"
            echo "runner=ubuntu-24.04-arm"
          } > fast-check-summary.txt

      - name: Upload fast-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linktrend-fast-check-${{ github.run_id }}
          path: fast-check-summary.txt
          retention-days: 30

  reconciled-fast:
    name: Linktrend Reconciled Fast Checks
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'reconciled'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      EXPECTED_REPOSITORY: ${{ inputs.expected_repository }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      INSTALLED_STATE_DIGEST: ${{ inputs.installed_state_digest }}
      LINKTREND_TARGET_BASELINE_SHA: ${{ inputs.target_baseline_sha }}
      LINKTREND_TARGET_BASELINE_REF: ${{ inputs.target_baseline_ref }}
    steps:
      - name: Checkout exact trusted development ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: development
          fetch-depth: 0
          persist-credentials: false
      - name: Bind reconciled Fast dispatch to exact installed development tree
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo reconciled_fast_commit_invalid; exit 1; }
          [[ "${EXPECTED_TREE}" =~ ^[0-9a-f]{40}$ ]] || { echo reconciled_fast_tree_invalid; exit 1; }
          [[ "${INSTALLED_STATE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo reconciled_fast_digest_invalid; exit 1; }
          python3 scripts/gitops/verify_reconciled_fast_dispatch.py \
            --repo . --expected-repository "${EXPECTED_REPOSITORY}" --actual-repository "${ACTUAL_REPOSITORY}" \
            --ref "${WORKFLOW_REF}" --expected-commit "${EXPECTED_COMMIT}" --expected-tree "${EXPECTED_TREE}" \
            --package-version "${PACKAGE_VERSION}" --installed-state-digest "${INSTALLED_STATE_DIGEST}"
      - name: Run exact Fast profile without cache or write authority
        run: |
          set -euo pipefail
          python3 scripts/gitops/generated_output_closure.py --finalize
          python3 scripts/gitops/run_delivery_profile.py fast --preflight
