name: Linktrend Full Suite
run-name: Full Suite PR #${{ inputs.pr_number }} @ ${{ inputs.head_sha }} r${{ inputs.seal_revision }} a${{ inputs.attempt }}

# Full validation is an explicit seal-bound dispatch.  It never wakes from a
# checkpoint push or from opening a draft PR.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact Phase PR number
        required: true
        type: string
      source_branch:
        description: Exact sealed Phase branch
        required: true
        type: string
      head_sha:
        description: Exact sealed Phase head
        required: true
        type: string
      candidate_id:
        description: Exact sealed candidate identity digest
        required: true
        type: string
      seal_revision:
        description: Sealed candidate revision (1 or 2)
        required: true
        type: string
      attempt:
        description: Infrastructure attempt for this exact candidate (1 or 2)
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.repository }}|${{ github.workflow }}|pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  full:
    name: Linktrend Full Suite
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      DISPATCH_SOURCE_BRANCH: ${{ inputs.source_branch }}
      DISPATCH_HEAD: ${{ inputs.head_sha }}
      DISPATCH_CANDIDATE_ID: ${{ inputs.candidate_id }}
      DISPATCH_SEAL_REVISION: ${{ inputs.seal_revision }}
      DISPATCH_ATTEMPT: ${{ inputs.attempt }}
    steps:
      - name: Capture start time
        id: clock
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact sealed Phase head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Validate live head and exact seal
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          live="$(jq -r .head.sha <<<"${pr}")"
          live_branch="$(jq -r .head.ref <<<"${pr}")"
          live_repo="$(jq -r .head.repo.full_name <<<"${pr}")"
          case "${live_branch}" in phase/*) ;; *) echo "full_suite_requires_phase_branch=${live_branch}"; exit 1;; esac
          test "${DISPATCH_SOURCE_BRANCH}" = "${live_branch}" || {
            echo "full_suite_source_branch_mismatch: input=${DISPATCH_SOURCE_BRANCH} live=${live_branch}"; exit 1;
          }
          test "${live_repo}" = "${GITHUB_REPOSITORY}" || {
            echo "full_suite_repository_mismatch: expected=${GITHUB_REPOSITORY} live=${live_repo}"; exit 1;
          }
          test "${DISPATCH_HEAD}" = "${live}" || {
            echo "full_suite_dispatch_head_stale: input=${DISPATCH_HEAD} live=${live}"; exit 1;
          }
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${live}" || { echo "full_suite_stale_seal: live=${live} actual=${actual}"; exit 1; }
          fast="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${live}&per_page=100" --jq '[.workflow_runs[] | select(.name == "Linktrend Fast Checks" and .conclusion == "success")] | length')"
          test "${fast}" -gt 0 || { echo "full_suite_fast_check_missing_for_exact_head"; exit 1; }
          tree="$(git rev-parse 'HEAD^{tree}')"
          derived="$(python3 - "${GITHUB_REPOSITORY}" "${live_branch}" "${live}" "${tree}" <<'PY'
          import hashlib
          import json
          import sys
          repository, branch, head, tree = sys.argv[1:]
          identity = {
              "repository": repository,
              "sourceSha": head,
              "gitTreeSha": tree,
              "dependencyDigests": {},
              "testProfile": "full",
          }
          print("sha256:" + hashlib.sha256(json.dumps(identity, sort_keys=True, separators=(",", ":")).encode()).hexdigest())
          PY
          )"
          test "${derived}" = "${DISPATCH_CANDIDATE_ID}" || {
            echo "full_suite_candidate_identity_mismatch: input=${DISPATCH_CANDIDATE_ID} derived=${derived}"; exit 1;
          }
          case "${DISPATCH_SEAL_REVISION}" in 1|2) ;; *) echo "full_suite_invalid_seal_revision"; exit 1;; esac
          case "${DISPATCH_ATTEMPT}" in 1|2) ;; *) echo "full_suite_invalid_attempt"; exit 1;; esac
          history="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/linktrend-integrator-merge.yml/runs?event=workflow_dispatch&per_page=100")"
          python3 - "${history}" "${PR_NUMBER}" "${live}" <<'PY'
          import json, re, sys
          history, pr_number, current_head = json.loads(sys.argv[1]), sys.argv[2], sys.argv[3]
          pattern = re.compile(r"^Full Suite PR #(\d+) @ ([0-9a-f]{40}) r([12]) a([12])$")
          relevant = []
          for run in history.get("workflow_runs", []):
              match = pattern.fullmatch(str(run.get("display_title") or ""))
              if match and match.group(1) == pr_number:
                  relevant.append((match.group(2), int(run.get("run_attempt") or 1)))
          heads = {head for head, _ in relevant} | {current_head}
          executions = sum(run_attempt for head, run_attempt in relevant if head == current_head)
          if len(heads) > 2:
              raise SystemExit("full_suite_sealed_candidate_limit")
          # Every paid execution counts, whether it is a fresh dispatch or a
          # GitHub UI rerun of an existing run.  The current run is present in
          # history before candidate tests begin, so a third execution stops.
          if executions > 2:
              raise SystemExit("full_suite_attempt_limit")
          PY
          printf 'SOURCE_BRANCH=%s\nEXPECTED_HEAD=%s\nCANDIDATE_ID=%s\nSEAL_REVISION=%s\nATTEMPT=%s\n' \
            "${live_branch}" "${live}" "${derived}" "${DISPATCH_SEAL_REVISION}" "${DISPATCH_ATTEMPT}" >> "$GITHUB_ENV"
          echo "exact dispatch-time seal accepted"

      - name: Run full profile
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          if [ "${GITHUB_REPOSITORY}" = "linktrend/IDE-Development" ]; then
            python3 -m unittest \
              scripts.tests.test_candidate_lifecycle \
              scripts.tests.test_gate_receipts \
              scripts.tests.test_promotion_receipt_gate \
              scripts.tests.test_phase_batch_lifecycle
            bash scripts/tests/test-gitops-phase-delivery.sh
          else
            ci_name="$(python3 -c 'import json; print(json.load(open(".github/linktrend-gitops-consumer.json"))["ciWorkflowName"])')"
            successes="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${EXPECTED_HEAD}&per_page=100" | jq --arg name "${ci_name}" '[.workflow_runs[] | select(.name == $name and .conclusion == "success")] | length')"
            test "${successes}" -gt 0 || { echo "consumer_full_suite_missing_for_exact_head=${EXPECTED_HEAD} workflow=${ci_name}"; exit 1; }
          fi

      - name: Write exact full-suite receipt
        if: success()
        working-directory: candidate
        env:
          STARTED: ${{ steps.clock.outputs.started_at }}
        run: |
          set -euo pipefail
          COMPLETED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "${STARTED}" "${COMPLETED}" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import sys
          # The workflow source checkout is the default branch; receipts must
          # be generated by the sealed candidate that just passed the suite.
          sys.path.insert(0, str(Path.cwd()))
          from scripts.gitops.coordinator.receipts import (
              canonical_digest,
              compute_candidate_identity,
              write_receipt,
          )

          started, completed = __import__("sys").argv[1:]
          commands = [
              "python3 -m unittest scripts.tests.test_candidate_lifecycle scripts.tests.test_gate_receipts scripts.tests.test_promotion_receipt_gate scripts.tests.test_phase_batch_lifecycle",
              "bash scripts/tests/test-gitops-phase-delivery.sh",
          ]
          if os.environ["GITHUB_REPOSITORY"] != "linktrend/IDE-Development":
              config = json.loads(Path(".github/linktrend-gitops-consumer.json").read_text())
              commands = [f"verify exact-head successful GitHub Actions workflow: {config['ciWorkflowName']}"]
          identity = compute_candidate_identity(
              Path("."),
              [],
              "full",
              profile_files=[".github/linktrend-delivery-mode.json"],
              source_branch=os.environ["SOURCE_BRANCH"],
          )
          summary = Path("full-suite-summary.txt")
          summary.write_text(
              "workflow=Linktrend Full Suite\n"
              f"repository={os.environ['GITHUB_REPOSITORY']}\n"
              f"head={identity.head_commit}\n"
              "runner=ubuntu-24.04-arm\n",
              encoding="utf-8",
          )
          evidence = {
              "full-suite-summary.txt": "sha256:" + hashlib.sha256(summary.read_bytes()).hexdigest()
          }
          result = {
              "schemaVersion": 2,
              "candidateIdentity": identity.to_dict(),
              "workflowRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runnerLabel": "ubuntu-24.04-arm",
              "startedAt": started,
              "completedAt": completed,
              "conclusion": "success",
              "commandDigest": canonical_digest({"profile": "full", "commands": commands}),
              "evidenceDigests": evidence,
          }
          write_receipt(result, Path("full-suite-receipt.json"))
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Upload retained full-suite receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linktrend-full-suite-receipt-${{ inputs.pr_number }}-${{ github.run_id }}
          path: |
            candidate/full-suite-receipt.json
            candidate/full-suite-summary.txt
          retention-days: 30

  bugbot:
    name: Linktrend Final Candidate Bugbot Request
    needs: full
    if: needs.full.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Request Bugbot once for the sealed candidate
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          marker="<!-- linktrend-bugbot-requested: ${HEAD_SHA} -->"
          comments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq '.[].body' || true)"
          if printf '%s\n' "${comments}" | grep -Fq "${marker}"; then
            echo "final_candidate_bugbot_request_already_recorded"
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="@cursor review\n${marker}"
