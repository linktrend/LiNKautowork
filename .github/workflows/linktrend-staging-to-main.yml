# Managed by IDE Development — do not edit by hand in consumers.
# Sync: scripts/sync-managed-workflows.sh
#
# TRUST BOUNDARY: privileged jobs check out the default branch only.
# Resolve (read-only) then promote (normal automation token) only when relevant.
name: LiNKtrend Staging To Main

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      action:
        description: "package | approve-merge | reevaluate"
        type: choice
        options:
          - package
          - approve-merge
          - reevaluate
        default: package
      expected_sha:
        description: "approve-merge: exact staging source SHA"
        required: false
        type: string
      expected_main_sha:
        description: "approve-merge: prior main target SHA"
        required: false
        type: string
      expected_promote_head:
        description: "approve-merge / reevaluate: exact promote PR head SHA"
        required: false
        type: string
      promote_pr_number:
        description: "reevaluate / approve-merge: exact promote PR number"
        required: false
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  check_run:
    types: [completed]
  workflow_run:
    workflows:
      - LiNKautowork CI
      - Branch Source Policy
    types: [completed]

permissions: {}

concurrency:
  group: staging-to-main
  cancel-in-progress: false

env:
  TIMEZONE_LABEL: "Asia/Taipei"
  RELEASE_GATE_CHECKS: ${{ vars.LINKTREND_RELEASE_GATE_CHECKS || 'Verify IDE Development,Enforce allowed PR source branches' }}

# Cost note: never use ${{ env.* }} at job-level env (invalid context → zero-job runs).
# Skip irrelevant wakes: non-promote PR heads, own outcome checks, failed workflow_run.
jobs:
  resolve:
    name: Resolve candidate (read-only)
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_target' &&
        startsWith(github.event.pull_request.head.ref, 'promote/')
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'promote/')
      ) ||
      (
        github.event_name == 'check_run' &&
        github.event.check_run.app.slug != 'github-actions' &&
        github.event.check_run.name != 'Linktrend Main Outcome' &&
        github.event.check_run.name != 'Linktrend Staging Outcome' &&
        github.event.check_run.name != 'Linktrend Packager Result' &&
        github.event.check_run.name != 'Linktrend Integrator Result'
      )
    runs-on: [self-hosted, macOS, ARM64, linktrend-privileged]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.r.outputs.relevant }}
      pr: ${{ steps.r.outputs.pr }}
      head_sha: ${{ steps.r.outputs.head_sha }}
      reason: ${{ steps.r.outputs.reason }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ github.event.inputs.action }}
        run: |
          set -euo pipefail
          MODE="reevaluate"
          case "${EVENT_NAME}" in
            schedule) MODE="package" ;;
            workflow_dispatch)
              case "${INPUT_ACTION:-package}" in
                package) MODE="package" ;;
                approve-merge) MODE="approve-merge" ;;
                *) MODE="reevaluate" ;;
              esac
              ;;
          esac
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

      - name: Resolve PR/base/head (no normal automation token)
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESOLVE_ROLE: main
        run: python3 scripts/gitops/resolve_event_pr.py

  promote:
    needs: resolve
    if: needs.resolve.outputs.relevant == 'true'
    runs-on: [self-hosted, macOS, ARM64, linktrend-privileged]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OUTCOME_CHECK_NAME: Linktrend Main Outcome
      # Job-level env cannot reference the env context (GitHub validation → zero-job push failures).
      # Workflow-level RELEASE_GATE_CHECKS already applies; restate via vars for clarity.
      RELEASE_GATE_CHECKS: ${{ vars.LINKTREND_RELEASE_GATE_CHECKS || 'Verify IDE Development,Enforce allowed PR source branches' }}
      REQUIRE_AUTOMATION_TOKEN: "1"
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check automation token
        id: creds
        env:
          LINKTREND_AUTOMATION_TOKEN: ${{ secrets.LINKTREND_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if source scripts/gitops/resolve_automation_token.sh; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report credentials blocked
        if: steps.creds.outputs.ready != 'true'
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # automation token unavailable: local outcome + failed workflow only — no GITHUB_TOKEN mutations.
          python3 scripts/gitops/write_outcome.py \
            --status automation_credentials_blocked \
            --detail "LINKTREND_AUTOMATION_TOKEN required for autonomous main promotion."
          echo "### Main outcome: \`automation_credentials_blocked\`" >> "$GITHUB_STEP_SUMMARY"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Configure git remote for automation token pushes
        if: steps.creds.outputs.ready == 'true'
        env:
          LINKTREND_AUTOMATION_TOKEN: ${{ secrets.LINKTREND_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/gitops/resolve_automation_token.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Run main promotion
        if: steps.creds.outputs.ready == 'true'
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          PROMOTE_PR_NUMBER: ${{ needs.resolve.outputs.pr || github.event.inputs.promote_pr_number }}
          EXPECTED_PROMOTE_HEAD: ${{ needs.resolve.outputs.head_sha || github.event.inputs.expected_promote_head }}
          EXPECTED_STAGING_SHA: ${{ github.event.inputs.expected_sha }}
          EXPECTED_MAIN_SHA: ${{ github.event.inputs.expected_main_sha }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LINKTREND_AUTOMATION_TOKEN: ${{ secrets.LINKTREND_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/gitops/resolve_automation_token.sh
          export GH_TOKEN="${AUTOMATION_TOKEN}"
          export GITHUB_TOKEN="${AUTOMATION_TOKEN}"
          if [ "${MODE}" = "approve-merge" ]; then
            if [ -z "${EXPECTED_STAGING_SHA}" ] || [ -z "${EXPECTED_PROMOTE_HEAD}" ] || [ -z "${EXPECTED_MAIN_SHA}" ]; then
              python3 scripts/gitops/write_outcome.py \
                --status failed \
                --detail "approve-merge requires expected_sha, expected_main_sha, and expected_promote_head"
              exit 1
            fi
          fi
          bash scripts/gitops/promote_main.sh
          status="$(python3 -c 'import json; print(json.load(open("gitops-outcome.json"))["status"])')"
          detail="$(python3 -c 'import json; print(json.load(open("gitops-outcome.json")).get("detail",""))')"
          sha="${EXPECTED_PROMOTE_HEAD:-$GITHUB_SHA}"
          python3 scripts/gitops/write_outcome.py \
            --status "$status" \
            --detail "$detail" \
            --check-name "$OUTCOME_CHECK_NAME" \
            --head-sha "$sha" \
            --token-env AUTOMATION_TOKEN
          echo "### Main outcome: \`${status}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${detail}" >> "$GITHUB_STEP_SUMMARY"
          echo "resolve_reason=${{ needs.resolve.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          case "${status}" in
            failed|automation_credentials_blocked) exit 1 ;;
            *) exit 0 ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-promote-report
          path: |
            gitops-outcome.json
            main-promote-report.md
            release-gate-wait.json
          if-no-files-found: ignore
          retention-days: 5
