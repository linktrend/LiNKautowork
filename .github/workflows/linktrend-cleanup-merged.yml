# Managed by IDE Development — do not edit by hand in consumers.
# Sync: scripts/sync-managed-workflows.sh
#
# Remote-only cleanup of merged/abandoned work + promote branches.
# Never deletes local worktrees (Lisa local cleanup is a separate handoff).
# TRUST BOUNDARY: checkout default branch only; normal automation token fail-closed.
name: LiNKtrend Cleanup Merged Branches

on:
  schedule:
    # Weekly Sunday 03:00 UTC (~11:00 Asia/Taipei)
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: linktrend-cleanup-merged
  cancel-in-progress: false

jobs:
  dry-run:
    name: Dry-run remote cleanup
    runs-on: [self-hosted, macOS, ARM64, linktrend-privileged]
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check automation token
        id: creds
        env:
          LINKTREND_AUTOMATION_TOKEN: ${{ secrets.LINKTREND_AUTOMATION_TOKEN }}
          REQUIRE_AUTOMATION_TOKEN: "1"
        run: |
          set -euo pipefail
          if source scripts/gitops/resolve_automation_token.sh; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "automation_credentials_blocked" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Dry-run remote cleanup
        if: steps.creds.outputs.ready == 'true'
        env:
          LINKTREND_AUTOMATION_TOKEN: ${{ secrets.LINKTREND_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/gitops/resolve_automation_token.sh
          export GH_TOKEN="${AUTOMATION_TOKEN}"
          export GITHUB_TOKEN="${AUTOMATION_TOKEN}"
          bash scripts/cleanup-merged-branches.sh --remote
          echo "### Cleanup dry-run complete" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cleanup-dry-run
          path: |
            gitops-outcome.json
          if-no-files-found: ignore
          retention-days: 3

  apply:
    name: Apply remote cleanup
    needs: dry-run
    if: needs.dry-run.outputs.ready == 'true'
    runs-on: [self-hosted, macOS, ARM64, linktrend-privileged]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply remote cleanup
        env:
          LINKTREND_AUTOMATION_TOKEN: ${{ secrets.LINKTREND_AUTOMATION_TOKEN }}
          REQUIRE_AUTOMATION_TOKEN: "1"
        run: |
          set -euo pipefail
          source scripts/gitops/resolve_automation_token.sh
          export GH_TOKEN="${AUTOMATION_TOKEN}"
          export GITHUB_TOKEN="${AUTOMATION_TOKEN}"
          bash scripts/cleanup-merged-branches.sh --remote --apply
          echo "### Cleanup apply complete (remote only; no local worktree deletion)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cleanup-apply
          path: |
            gitops-outcome.json
          if-no-files-found: ignore
          retention-days: 3
